[project]
name = "ggl"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.2",
    "pyyaml>=6.0",
    "wandb>=0.16",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
    "python-dotenv>=1.2.4",
    "pandas>=3.1.0",
    "lightning>=2.6.6",
    "tqdm>=4.70.1",
    "ipykernel>=7.4.0",
    "scipy>=1.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ggl"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.mutmut]
# Use the source root so /init-project can rename the package unchanged.
source_paths = ["src/"]
also_copy = ["tests/", "cli/", "experiments/", "pyproject.toml"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
# Ruff's defaults plus E501 (line length) and W505 (comment/docstring length).
select = ["E4", "E7", "E9", "F", "E501", "W505"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 79

[dependency-groups]
dev = [
    "mutmut>=3.8.1,<4 ; sys_platform == 'linux'",
    "pytest>=8.0",
    "pytest-cov>=6",
    "ruff>=0.4",
]
